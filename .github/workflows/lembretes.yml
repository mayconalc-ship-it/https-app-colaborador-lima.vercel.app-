name: Lembretes do Jornal

# O plano Hobby da Vercel só libera cron nativo uma vez por dia -- cedo
# demais para "avise às 14h de hoje". O GitHub Actions roda de graça e
# sem essa trava, então é ele quem bate na porta do endpoint.
#
# O `*/15` abaixo é um PEDIDO, não uma promessa, e a diferença é grande:
# medindo as 14 execuções reais em 21/08/2026, o intervalo foi de 54 min
# no melhor caso, ~100 min na mediana e 216 min no pior. O GitHub
# estrangula workflows agendados, e não há o que ajustar no cron para
# mudar isso.
#
# Consequência prática, que está escrita na tela do RH: a MATÉRIA
# agendada entra na hora exata (quem solta a linha é a política de
# leitura, ver migration 044), mas o SINO e o PUSH dela podem sair até
# cerca de uma hora depois. Serve para "lembrete de treinamento de
# amanhã"; não serve para "começa em 10 minutos".
#
# Para apertar isso sem sair do plano Hobby: apontar um pinger externo
# (cron-job.org, UptimeRobot) para o mesmo endpoint. A rota é
# idempotente e protegida por Bearer, então dois chamadores simultâneos
# não fazem estrago.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  disparar:
    runs-on: ubuntu-latest
    steps:
      # Exige 200 explicitamente, e não só "o curl não deu erro".
      #
      # A versão anterior era `curl -sf`, e ela mentiu por semanas: o
      # proxy do app redirecionava a rota para /login (faltava a exceção
      # de /api/cron no matcher), o endpoint NUNCA rodava, e o -f não
      # reclama de 307 -- só de 4xx/5xx. O workflow ficava verde enquanto
      # nenhum lembrete saía. Comparar o código na mão custa duas linhas
      # e faz esse tipo de falha aparecer no mesmo dia.
      - name: Chamar o endpoint de lembretes
        run: |
          codigo=$(curl -sS -o resposta.json -w "%{http_code}" \
            "https://app-colaborador-lima.vercel.app/api/cron/lembretes" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          echo "HTTP $codigo"
          cat resposta.json
          test "$codigo" = "200"
