name: Lembretes do Jornal

# O plano Hobby da Vercel só libera cron nativo uma vez por dia -- cedo
# demais para "avise às 14h de hoje". O GitHub Actions roda de graça e
# sem essa trava, então é ele quem bate na porta do endpoint.
#
# Nem o GitHub garante o minuto exato (a documentação deles avisa que
# workflows agendados podem atrasar em horários de pico), então o
# lembrete dispara com alguns minutos de folga em relação à hora
# marcada -- suficiente para "lembrete de treinamento", não para algo
# que precise do segundo certo.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  disparar:
    runs-on: ubuntu-latest
    steps:
      # Exige 200 explicitamente, e não só "o curl não deu erro".
      #
      # A versão anterior era `curl -sf`, e ela mentiu por semanas: o
      # proxy do app redirecionava a rota para /login (faltava a exceção
      # de /api/cron no matcher), o endpoint NUNCA rodava, e o -f não
      # reclama de 307 -- só de 4xx/5xx. O workflow ficava verde enquanto
      # nenhum lembrete saía. Comparar o código na mão custa duas linhas
      # e faz esse tipo de falha aparecer no mesmo dia.
      - name: Chamar o endpoint de lembretes
        run: |
          codigo=$(curl -sS -o resposta.json -w "%{http_code}" \
            "https://app-colaborador-lima.vercel.app/api/cron/lembretes" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          echo "HTTP $codigo"
          cat resposta.json
          test "$codigo" = "200"
